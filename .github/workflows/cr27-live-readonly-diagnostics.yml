name: CR-27 Live Read-Only Diagnostics

on:
  push:
    branches:
      - ops/cr27-live-readonly-diagnostics-20260901

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run read-only production diagnostics
        run: node scripts/cr27-live-readonly-diagnostics.mjs
