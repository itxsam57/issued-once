name: Hostinger Strict Header Audit

on:
  workflow_dispatch:
  push:
    branches:
      - engineering/live-header-proof-20260826

permissions:
  contents: read

jobs:
  strict-header-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LIVE_PRODUCTION_URL: https://lightgray-coyote-141764.hostingersite.com
      EXPECTED_RELEASE_ID: 28ff7deb6b1fe7578c271131f1655fc46898cefd
      LIVE_RELEASE_HEALTH_ATTEMPTS: '3'
      LIVE_RELEASE_HEALTH_DELAY_MS: '2000'
    steps:
      - name: Checkout engineering proof
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Syntax-check live proof scripts
        run: |
          node --check tests/e2e/live-release-health.mjs
          node --check tests/e2e/live-security-headers.mjs
          node --check tests/e2e/live-non-otp-boundaries.mjs
      - name: Prove exact live release
        run: node tests/e2e/live-release-health.mjs
      - name: Enforce bare-home security headers
        run: node tests/e2e/live-security-headers.mjs
