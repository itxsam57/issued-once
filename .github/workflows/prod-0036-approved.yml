name: Approved production migration 0036

on:
  push:
    branches:
      - ops/prod-0036-approved-20260901

permissions:
  contents: read

concurrency:
  group: issued-once-prod-migration-0036
  cancel-in-progress: false

jobs:
  migrate-0036:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout approved integration lineage
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Preflight, apply only 0036, and verify
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "DATABASE_URL GitHub Actions secret is unavailable; no SQL executed." >&2
            exit 20
          fi

          node --input-type=module <<'NODE'
          import { neon } from '@neondatabase/serverless';

          const connectionString = process.env.DATABASE_URL;
          if (!connectionString) throw new Error('DATABASE_URL is unavailable');
          const sql = neon(connectionString);

          const relation = await sql`
            SELECT
              to_regclass('public.issues')::text AS issues_table,
              to_regclass('public.artwork_objects')::text AS artwork_objects_table
          `;
          const state = relation[0] ?? {};
          if (!state.issues_table) {
            throw new Error('0036 preflight failed: public.issues does not exist');
          }

          async function inspectCore() {
            const columns = await sql`
              SELECT column_name, udt_name, is_nullable
              FROM information_schema.columns
              WHERE table_schema = 'public' AND table_name = 'artwork_objects'
              ORDER BY ordinal_position
            `;
            const expected = new Map([
              ['issue_id', 'uuid'],
              ['artifact_id', 'uuid'],
              ['mime_type', 'text'],
              ['bytes', 'bytea'],
              ['byte_count', 'int8'],
              ['sha256', 'text'],
              ['created_at', 'timestamptz'],
            ]);
            if (columns.length !== expected.size) {
              throw new Error(`0036 schema mismatch: expected ${expected.size} columns, found ${columns.length}`);
            }
            for (const column of columns) {
              const expectedType = expected.get(column.column_name);
              if (!expectedType || column.udt_name !== expectedType || column.is_nullable !== 'NO') {
                throw new Error(`0036 schema mismatch at column ${column.column_name}`);
              }
            }

            const constraints = await sql`
              SELECT contype, pg_get_constraintdef(oid) AS definition
              FROM pg_constraint
              WHERE conrelid = 'public.artwork_objects'::regclass
            `;
            const defs = constraints.map((row) => String(row.definition ?? '').toLowerCase().replace(/\s+/g, ''));
            const has = (kind, pattern) => constraints.some((row, index) => row.contype === kind && pattern.test(defs[index]));
            if (!has('p', /primarykey\(issue_id,artifact_id\)/)) throw new Error('0036 schema mismatch: primary key');
            if (!has('f', /foreignkey\(issue_id\)referencesissues\(id\)/)) throw new Error('0036 schema mismatch: issues foreign key');
            if (!defs.some((d) => /mime_type='image\/png'/.test(d))) throw new Error('0036 schema mismatch: PNG MIME check');
            if (!defs.some((d) => /byte_count>0/.test(d))) throw new Error('0036 schema mismatch: positive byte count check');
            if (!defs.some((d) => /octet_length\(bytes\)=byte_count/.test(d))) throw new Error('0036 schema mismatch: byte integrity check');
            if (!defs.some((d) => /byte_count<=25165824/.test(d))) throw new Error('0036 schema mismatch: byte cap check');
            if (!defs.some((d) => /sha256~/.test(d) && /\[0-9a-f\]/.test(d))) throw new Error('0036 schema mismatch: SHA-256 format check');

            const namedIndex = await sql`
              SELECT indexdef
              FROM pg_indexes
              WHERE schemaname = 'public'
                AND tablename = 'artwork_objects'
                AND indexname = 'artwork_objects_created_at_idx'
            `;
            if (namedIndex.length > 0 && !String(namedIndex[0].indexdef ?? '').toLowerCase().includes('(created_at)')) {
              throw new Error('0036 schema mismatch: named created_at index has unexpected definition');
            }
            return namedIndex.length > 0;
          }

          const existed = Boolean(state.artwork_objects_table);
          if (existed) {
            await inspectCore();
          }
          console.log(`0036 preflight: issues=present artwork_objects=${existed ? 'present-compatible' : 'absent'}`);

          await sql.transaction([
            sql`
              CREATE TABLE IF NOT EXISTS artwork_objects (
                issue_id UUID NOT NULL REFERENCES issues(id),
                artifact_id UUID NOT NULL,
                mime_type TEXT NOT NULL,
                bytes BYTEA NOT NULL,
                byte_count BIGINT NOT NULL CHECK (byte_count > 0),
                sha256 TEXT NOT NULL CHECK (sha256 ~ '^[0-9a-f]{64}$'),
                created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
                PRIMARY KEY (issue_id, artifact_id),
                CHECK (mime_type = 'image/png'),
                CHECK (octet_length(bytes) = byte_count),
                CHECK (byte_count <= 25165824)
              )
            `,
            sql`
              CREATE INDEX IF NOT EXISTS artwork_objects_created_at_idx
                ON artwork_objects(created_at)
            `,
          ]);

          const hasIndex = await inspectCore();
          if (!hasIndex) throw new Error('0036 postflight failed: created_at index is absent');
          console.log(`0036 verified: artwork_objects=${existed ? 'already-compatible' : 'created'} index=present`);
          NODE
