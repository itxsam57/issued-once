name: Browser QA

# Permanent release gate: exercise the real customer journey.
on:
  pull_request:
    paths:
      - 'src/app/**'
      - 'src/components/**'
      - 'tests/e2e/**'
      - 'tests/unit/live-vercel-preview-harness.test.ts'
      - 'playwright.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/browser-qa.yml'
  workflow_dispatch:
    inputs:
      preview_url:
        description: Preview URL to exercise
        required: true
        type: string

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENABLE_VISUAL_PREVIEW: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml', 'package.json') }}
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
      - name: Browser tests
        run: pnpm test:e2e
      - name: Live preview smoke
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/feat/mystery-foundation'
        env:
          PREVIEW_URL: ${{ inputs.preview_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node tests/e2e/live-preview-smoke.mjs
      - name: Live production customer journey
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/mystery-foundation'
        env:
          LIVE_PRODUCTION_URL: https://issuedonce.shop
        run: node tests/e2e/live-production-smoke.mjs
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issued-once-browser-qa
          path: |
            artifacts/visual
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
