name: Safepay Isolated Verification

on:
  push:
    branches:
      - engineering/safepay-reporter-v1-verification-20260826

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Focused Safepay regression
        run: pnpm exec vitest run tests/unit/safepay-gateway.test.ts
      - name: Full unit tests
        run: pnpm test
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Production build
        run: pnpm build

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENABLE_VISUAL_PREVIEW: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install chromium
      - name: Browser tests
        run: pnpm test:e2e
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issued-once-safepay-browser-qa
          path: |
            artifacts/visual
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
