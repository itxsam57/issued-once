name: Verify CR-27 0036 runner v2

on:
  push:
    branches:
      - ops/cr-27-0036-runner-v2-20260901

permissions:
  contents: read

jobs:
  verify-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout runner
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify runner diff is isolated
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only 6b64b3b000cff18db2ac27b8c5494b0c72670211...HEAD | sort > /tmp/actual
          printf '%s\n' \
            '.engineering/CR27_0036_EXECUTE' \
            '.github/workflows/verify-cr27-0036-runner-v2.yml' \
            'scripts/apply-approved-0036.mjs' | sort > /tmp/allowed
          if [ -n "$(comm -23 /tmp/actual /tmp/allowed)" ]; then
            echo 'Unexpected file outside the isolated CR-27 migration runner:' >&2
            comm -23 /tmp/actual /tmp/allowed >&2
            exit 1
          fi
          grep -Fxq '.github/workflows/verify-cr27-0036-runner-v2.yml' /tmp/actual
          grep -Fxq 'scripts/apply-approved-0036.mjs' /tmp/actual

      - name: Verify exact 0036 source contract without DB access
        run: node scripts/apply-approved-0036.mjs --contract-only

      - name: Unit tests
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

  migrate-0036:
    if: >-
      github.event_name == 'push' &&
      github.event.head_commit.message == 'ops(cr-27): execute approved 0036 migration' &&
      contains(github.event.head_commit.added, '.engineering/CR27_0036_EXECUTE')
    needs: verify-runner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout runner
        uses: actions/checkout@v4

      - name: Verify one-time execution sentinel
        shell: bash
        run: |
          set -euo pipefail
          test -f .engineering/CR27_0036_EXECUTE
          test "$(cat .engineering/CR27_0036_EXECUTE)" = 'APPROVE_PRODUCTION_PREFLIGHT_0036_AND_DEPLOYMENT'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Production preflight, apply exact 0036, and verify
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "DATABASE_URL GitHub Actions secret is unavailable; no SQL executed." >&2
            exit 20
          fi
          node scripts/apply-approved-0036.mjs
