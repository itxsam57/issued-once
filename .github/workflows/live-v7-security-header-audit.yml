name: Live V9 Security Header Audit

on:
  push:
    branches:
      - audit/live-v7-security-headers-20260825
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-live-headers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LIVE_PRODUCTION_URL: https://lightgray-coyote-141764.hostingersite.com
      EXPECTED_RELEASE_ID: f818c1b5574289b2bc635305dfa1bd9a431529fc
      LIVE_RELEASE_HEALTH_ATTEMPTS: '3'
      LIVE_RELEASE_HEALTH_DELAY_MS: '1000'
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
      - name: Confirm exact deployed V9 release
        run: node tests/e2e/live-release-health.mjs
      - name: Diagnose cached and cache-busted HTML security paths
        run: |
          node <<'NODE'
          const baseUrl = process.env.LIVE_PRODUCTION_URL.replace(/\/$/, '');
          const expected = {
            'strict-transport-security': 'max-age=31536000; includeSubDomains',
            'x-content-type-options': 'nosniff',
            'x-frame-options': 'DENY',
            'referrer-policy': 'strict-origin-when-cross-origin',
            'permissions-policy': 'camera=(), microphone=(), geolocation=()',
          };

          async function inspect(label, path, expectedStatus) {
            const response = await fetch(`${baseUrl}${path}`, {
              headers: { accept: path.startsWith('/api/') ? 'application/json' : 'text/html' },
              redirect: 'error',
              signal: AbortSignal.timeout(10_000),
            });
            const cacheControl = response.headers.get('cache-control') ?? '';
            console.log(`LIVE_PATH label=${label} status=${response.status} cache-control=${cacheControl || 'missing'}`);
            const missing = [];
            for (const [name, value] of Object.entries(expected)) {
              const actual = response.headers.get(name);
              console.log(`LIVE_HEADER label=${label} ${name}=${actual ?? 'missing'}`);
              if (actual !== value) missing.push(name);
            }
            console.log(`LIVE_HEADER label=${label} x-powered-by=${response.headers.has('x-powered-by') ? 'present' : 'absent'}`);
            if (response.status !== expectedStatus) throw new Error(`${label} returned HTTP ${response.status}`);
            return { cacheControl, missing, poweredBy: response.headers.has('x-powered-by') };
          }

          const cachedHome = await inspect('cached-home', '/', 200);
          const cacheBustedHome = await inspect('cache-busted-home', `/?__issued_once_release=${process.env.EXPECTED_RELEASE_ID}`, 200);
          const releaseApi = await inspect('release-api', '/api/health/release', 200);
          const legacy = await inspect('legacy-control', '/api/checkout/start', 410);

          if (cacheBustedHome.missing.length || cacheBustedHome.poweredBy) {
            throw new Error(`cache-busted homepage still missing security headers: ${cacheBustedHome.missing.join(',')}`);
          }
          if (/s-maxage=31536000/i.test(cacheBustedHome.cacheControl)) {
            throw new Error('cache-busted homepage still uses year-long prerender cache');
          }
          if (releaseApi.missing.length || releaseApi.poweredBy) throw new Error('dynamic release API security baseline failed');
          if (legacy.missing.length || legacy.poweredBy || legacy.cacheControl !== 'no-store') throw new Error('legacy Proxy control security baseline failed');

          const staleCachedObject = cachedHome.missing.length > 0 && cacheBustedHome.missing.length === 0;
          console.log(`LIVE_V9_CACHE_DIAGNOSIS staleCachedObject=${staleCachedObject} cachedHomeMissing=${cachedHome.missing.length} cacheBustedHomeMissing=${cacheBustedHome.missing.length}`);
          NODE
