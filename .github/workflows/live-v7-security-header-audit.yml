name: Live V9 Security Header Audit

on:
  push:
    branches:
      - audit/live-v7-security-headers-20260825
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-live-headers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LIVE_PRODUCTION_URL: https://lightgray-coyote-141764.hostingersite.com
      EXPECTED_RELEASE_ID: f818c1b5574289b2bc635305dfa1bd9a431529fc
      LIVE_RELEASE_HEALTH_ATTEMPTS: '10'
      LIVE_RELEASE_HEALTH_DELAY_MS: '1000'
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
      - name: Confirm exact deployed V9 release
        run: node tests/e2e/live-release-health.mjs
      - name: Probe Hostinger bare-home cache revalidation
        run: |
          node <<'NODE'
          const baseUrl = process.env.LIVE_PRODUCTION_URL.replace(/\/$/, '');
          const expected = {
            'strict-transport-security': 'max-age=31536000; includeSubDomains',
            'x-content-type-options': 'nosniff',
            'x-frame-options': 'DENY',
            'referrer-policy': 'strict-origin-when-cross-origin',
            'permissions-policy': 'camera=(), microphone=(), geolocation=()',
          };

          async function inspect(label, path, extraHeaders = {}) {
            const response = await fetch(`${baseUrl}${path}`, {
              headers: { accept: path.startsWith('/api/') ? 'application/json' : 'text/html', ...extraHeaders },
              redirect: 'error',
              signal: AbortSignal.timeout(10_000),
            });
            const cacheControl = response.headers.get('cache-control') ?? '';
            const cacheStatus = response.headers.get('x-hcdn-cache-status') ?? response.headers.get('x-litespeed-cache') ?? 'unreported';
            const missing = Object.entries(expected)
              .filter(([name, value]) => response.headers.get(name) !== value)
              .map(([name]) => name);
            console.log(`LIVE_CACHE_PROBE label=${label} status=${response.status} cache-control=${cacheControl || 'missing'} cache-status=${cacheStatus} missing=${missing.length}`);
            if (response.status !== 200) throw new Error(`${label} returned HTTP ${response.status}`);
            return { cacheControl, missing, poweredBy: response.headers.has('x-powered-by') };
          }

          const before = await inspect('before', '/');
          const revalidated = await inspect('no-cache-request', '/', { 'cache-control': 'no-cache', pragma: 'no-cache' });
          const after = await inspect('after', '/');
          const cacheBusted = await inspect('cache-busted', `/?__issued_once_release=${process.env.EXPECTED_RELEASE_ID}`);

          if (cacheBusted.missing.length || cacheBusted.poweredBy || /s-maxage=31536000/i.test(cacheBusted.cacheControl)) {
            throw new Error('V9 runtime HTML security path is not healthy');
          }

          console.log(`LIVE_CACHE_REVALIDATION_RESULT beforeMissing=${before.missing.length} noCacheMissing=${revalidated.missing.length} afterMissing=${after.missing.length}`);
          NODE
