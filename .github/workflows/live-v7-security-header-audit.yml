name: Live V8 Security Header Audit

on:
  push:
    branches:
      - audit/live-v7-security-headers-20260825
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-live-headers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LIVE_PRODUCTION_URL: https://lightgray-coyote-141764.hostingersite.com
      EXPECTED_RELEASE_ID: 08e991b585b41dc126f9ff3d7ff79ef1daf1580d
      LIVE_RELEASE_HEALTH_ATTEMPTS: '3'
      LIVE_RELEASE_HEALTH_DELAY_MS: '1000'
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
      - name: Confirm exact deployed V8 release
        run: node tests/e2e/live-release-health.mjs
      - name: Verify Hostinger security headers
        run: |
          node <<'NODE'
          const baseUrl = process.env.LIVE_PRODUCTION_URL.replace(/\/$/, '');
          const expected = {
            'strict-transport-security': 'max-age=31536000; includeSubDomains',
            'x-content-type-options': 'nosniff',
            'x-frame-options': 'DENY',
            'referrer-policy': 'strict-origin-when-cross-origin',
            'permissions-policy': 'camera=(), microphone=(), geolocation=()',
          };

          const legacy = await fetch(`${baseUrl}/api/checkout/start`, {
            redirect: 'error',
            signal: AbortSignal.timeout(10_000),
          });
          console.log(`LIVE_PROXY_CONTROL status=${legacy.status} cache-control=${legacy.headers.get('cache-control') ?? 'missing'}`);
          if (legacy.status !== 410) throw new Error(`legacy control returned HTTP ${legacy.status}`);
          if (legacy.headers.get('cache-control') !== 'no-store') throw new Error('legacy no-store header missing');

          for (const path of ['/', '/api/health/release']) {
            const response = await fetch(`${baseUrl}${path === '/' ? '/' : path}`, {
              headers: { accept: path === '/' ? 'text/html' : 'application/json' },
              redirect: 'error',
              signal: AbortSignal.timeout(10_000),
            });
            if (!response.ok) throw new Error(`${path} returned HTTP ${response.status}`);
            for (const [name, value] of Object.entries(expected)) {
              const actual = response.headers.get(name);
              console.log(`LIVE_HEADER path=${path} ${name}=${actual ?? 'missing'}`);
              if (actual !== value) throw new Error(`${name} mismatch on ${path}`);
            }
            if (response.headers.has('x-powered-by')) throw new Error(`x-powered-by present on ${path}`);
          }

          for (const [name, value] of Object.entries(expected)) {
            if (legacy.headers.get(name) !== value) throw new Error(`${name} mismatch on legacy response`);
          }

          console.log(`LIVE_SECURITY_HEADERS_PASS release=${process.env.EXPECTED_RELEASE_ID} normalPaths=2 legacyControl=pass poweredBy=absent`);
          NODE
