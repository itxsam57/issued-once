name: Live V8 Security Header Audit

on:
  push:
    branches:
      - audit/live-v7-security-headers-20260825
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-live-headers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LIVE_PRODUCTION_URL: https://lightgray-coyote-141764.hostingersite.com
      EXPECTED_RELEASE_ID: 08e991b585b41dc126f9ff3d7ff79ef1daf1580d
      LIVE_RELEASE_HEALTH_ATTEMPTS: '3'
      LIVE_RELEASE_HEALTH_DELAY_MS: '1000'
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
      - name: Confirm exact deployed V8 release
        run: node tests/e2e/live-release-health.mjs
      - name: Diagnose Hostinger security-header paths
        run: |
          node <<'NODE'
          const baseUrl = process.env.LIVE_PRODUCTION_URL.replace(/\/$/, '');
          const expected = {
            'strict-transport-security': 'max-age=31536000; includeSubDomains',
            'x-content-type-options': 'nosniff',
            'x-frame-options': 'DENY',
            'referrer-policy': 'strict-origin-when-cross-origin',
            'permissions-policy': 'camera=(), microphone=(), geolocation=()',
          };
          const failures = [];

          const targets = [
            { path: '/', accept: 'text/html', expectStatus: 200 },
            { path: '/api/health/release', accept: 'application/json', expectStatus: 200 },
            { path: '/api/checkout/start', accept: 'application/json', expectStatus: 410, expectNoStore: true },
          ];

          for (const target of targets) {
            const response = await fetch(`${baseUrl}${target.path}`, {
              headers: { accept: target.accept },
              redirect: 'error',
              signal: AbortSignal.timeout(10_000),
            });
            console.log(`LIVE_PATH path=${target.path} status=${response.status} cache-control=${response.headers.get('cache-control') ?? 'missing'}`);
            if (response.status !== target.expectStatus) failures.push(`${target.path}:status`);
            if (target.expectNoStore && response.headers.get('cache-control') !== 'no-store') failures.push(`${target.path}:no-store`);

            for (const [name, value] of Object.entries(expected)) {
              const actual = response.headers.get(name);
              console.log(`LIVE_HEADER path=${target.path} ${name}=${actual ?? 'missing'}`);
              if (actual !== value) failures.push(`${target.path}:${name}`);
            }
            const poweredBy = response.headers.has('x-powered-by');
            console.log(`LIVE_HEADER path=${target.path} x-powered-by=${poweredBy ? 'present' : 'absent'}`);
            if (poweredBy) failures.push(`${target.path}:x-powered-by`);
          }

          if (failures.length) {
            throw new Error(`security header mismatches: ${failures.join(',')}`);
          }
          console.log(`LIVE_SECURITY_HEADERS_PASS release=${process.env.EXPECTED_RELEASE_ID} paths=${targets.length}`);
          NODE
