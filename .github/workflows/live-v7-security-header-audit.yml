name: Live V7 Security Header Audit

on:
  push:
    branches:
      - audit/live-v7-security-headers-20260825
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-live-headers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LIVE_PRODUCTION_URL: https://lightgray-coyote-141764.hostingersite.com
      EXPECTED_RELEASE_ID: cd9cd9909f12e2d6ad864f7a5fcd9144185351ee
      LIVE_RELEASE_HEALTH_ATTEMPTS: '3'
      LIVE_RELEASE_HEALTH_DELAY_MS: '1000'
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
      - name: Confirm exact deployed V7 release
        run: node tests/e2e/live-release-health.mjs
      - name: Inspect Hostinger response-header behavior
        run: |
          node <<'NODE'
          const baseUrl = process.env.LIVE_PRODUCTION_URL.replace(/\/$/, '');
          const expected = {
            'strict-transport-security': 'max-age=31536000; includeSubDomains',
            'x-content-type-options': 'nosniff',
            'x-frame-options': 'DENY',
            'referrer-policy': 'strict-origin-when-cross-origin',
            'permissions-policy': 'camera=(), microphone=(), geolocation=()',
          };

          const legacy = await fetch(`${baseUrl}/api/checkout/start`, {
            redirect: 'error',
            signal: AbortSignal.timeout(10_000),
          });
          console.log(`LIVE_PROXY_CONTROL status=${legacy.status} cache-control=${legacy.headers.get('cache-control') ?? 'missing'}`);
          if (legacy.status !== 410) throw new Error(`legacy control returned HTTP ${legacy.status}`);

          const response = await fetch(`${baseUrl}/`, {
            headers: { accept: 'text/html' },
            redirect: 'error',
            signal: AbortSignal.timeout(10_000),
          });
          if (!response.ok) throw new Error(`home returned HTTP ${response.status}`);

          const observed = {};
          for (const name of Object.keys(expected)) {
            observed[name] = response.headers.get(name);
            console.log(`LIVE_HEADER ${name}=${observed[name] ?? 'missing'}`);
          }
          console.log(`LIVE_HEADER x-powered-by=${response.headers.has('x-powered-by') ? 'present' : 'absent'}`);

          if (legacy.headers.get('cache-control') !== 'no-store') {
            throw new Error('proxy-set cache-control did not survive Hostinger');
          }
          for (const [name, value] of Object.entries(expected)) {
            if (observed[name] !== value) throw new Error(`${name} mismatch`);
          }
          if (response.headers.has('x-powered-by')) throw new Error('x-powered-by must remain disabled');

          console.log(`LIVE_SECURITY_HEADERS_PASS release=${process.env.EXPECTED_RELEASE_ID} verified=${Object.keys(expected).length} poweredBy=absent`);
          NODE
