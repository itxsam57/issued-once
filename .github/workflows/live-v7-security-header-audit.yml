name: Live V10 Security Header Audit

on:
  push:
    branches:
      - audit/live-v7-security-headers-20260825
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-live-headers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LIVE_PRODUCTION_URL: https://lightgray-coyote-141764.hostingersite.com
      EXPECTED_RELEASE_ID: aa73848e9ef79905e8239f9fb4cc8fce244e04c6
      LIVE_RELEASE_HEALTH_ATTEMPTS: '10'
      LIVE_RELEASE_HEALTH_DELAY_MS: '1000'
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
      - name: Confirm exact deployed V10 release
        run: node tests/e2e/live-release-health.mjs
      - name: Require security headers on bare home and dynamic controls
        run: |
          node <<'NODE'
          const baseUrl = process.env.LIVE_PRODUCTION_URL.replace(/\/$/, '');
          const expected = {
            'strict-transport-security': 'max-age=31536000; includeSubDomains',
            'x-content-type-options': 'nosniff',
            'x-frame-options': 'DENY',
            'referrer-policy': 'strict-origin-when-cross-origin',
            'permissions-policy': 'camera=(), microphone=(), geolocation=()',
          };

          async function inspect(path, expectedStatus = 200) {
            const response = await fetch(`${baseUrl}${path}`, {
              headers: { accept: path.startsWith('/api/') ? 'application/json' : 'text/html' },
              redirect: 'error',
              signal: AbortSignal.timeout(10_000),
            });
            const cacheControl = response.headers.get('cache-control') ?? 'missing';
            const cacheStatus = response.headers.get('x-hcdn-cache-status') ?? response.headers.get('x-litespeed-cache') ?? 'unreported';
            const missing = Object.entries(expected)
              .filter(([name, value]) => response.headers.get(name) !== value)
              .map(([name]) => name);
            const poweredBy = response.headers.has('x-powered-by');
            console.log(`LIVE_V10_HEADER path=${path} status=${response.status} cache-control=${cacheControl} cache-status=${cacheStatus} missing=${missing.length} poweredBy=${poweredBy ? 'present' : 'absent'}`);
            if (response.status !== expectedStatus) throw new Error(`${path} returned HTTP ${response.status}`);
            if (missing.length) throw new Error(`${path} missing security headers: ${missing.join(',')}`);
            if (poweredBy) throw new Error(`${path} exposes x-powered-by`);
            return { cacheControl, cacheStatus };
          }

          const home = await inspect('/');
          await inspect('/api/health/release');
          const legacy = await inspect('/api/checkout/start', 410);
          if (!/no-store/i.test(legacy.cacheControl)) throw new Error('legacy control must remain no-store');
          console.log(`LIVE_V10_SECURITY_HEADERS_PASS homeCache=${home.cacheStatus} release=${process.env.EXPECTED_RELEASE_ID}`);
          NODE
