name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install dependencies and generate lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Capture generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: issued-once-pnpm-lock
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1
      - name: Unit tests
        run: pnpm test
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Production build
        run: pnpm build
