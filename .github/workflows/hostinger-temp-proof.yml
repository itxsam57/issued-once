name: Hostinger Temporary Release Proof

on:
  workflow_dispatch:
  push:
    branches:
      - release/hostinger-v2-candidate-20260824

permissions:
  contents: read

jobs:
  prove-hostinger-temp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIVE_PRODUCTION_URL: https://lightgray-coyote-141764.hostingersite.com
      EXPECTED_RELEASE_ID: a888c1ab63fb7f4af4632610243be6d7597ac57b
    steps:
      - name: Checkout frozen Hostinger V3 candidate
        uses: actions/checkout@v4
        with:
          ref: release/hostinger-v3-candidate-20260825
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install chromium
      - name: Prove release identity and runtime boundaries
        run: node tests/e2e/live-release-health.mjs
      - name: Prove Tee Cap Tote physical gates and real mailbox request
        run: node tests/e2e/live-production-smoke.mjs
      - name: Upload live proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hostinger-temporary-live-proof
          path: artifacts/visual
          if-no-files-found: ignore
          retention-days: 7
