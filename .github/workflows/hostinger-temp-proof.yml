name: Hostinger Temporary Release Proof

on:
  workflow_dispatch:
  push:
    branches:
      - release/hostinger-v2-candidate-20260824

permissions:
  contents: read

jobs:
  prove-hostinger-temp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIVE_PRODUCTION_URL: https://lightgray-coyote-141764.hostingersite.com
      EXPECTED_RELEASE_ID: ${{ github.sha }}
    steps:
      - name: Checkout pushed Hostinger candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install chromium
      - name: Wait for exact release identity and runtime readiness
        run: node tests/e2e/live-release-health.mjs
      - name: Prove Tee Cap Tote physical gates and real mailbox request
        run: node tests/e2e/live-production-smoke.mjs
      - name: Upload live proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hostinger-temporary-live-proof
          path: artifacts/visual
          if-no-files-found: ignore
          retention-days: 7
