name: Hostinger Temporary Release Proof

on:
  pull_request:
    branches:
      - feat/mystery-foundation
    paths:
      - '.github/workflows/hostinger-temp-proof.yml'
      - 'tests/e2e/live-otp-tempmail.mjs'

permissions:
  contents: read

jobs:
  prove-hostinger-temp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIVE_PRODUCTION_URL: https://lightgray-coyote-141764.hostingersite.com
      EXPECTED_RELEASE_ID: 3fa3b82e56d604d2d36e6634c88ac98e48920a92
    steps:
      - name: Checkout frozen Hostinger V2 candidate
        uses: actions/checkout@v4
        with:
          ref: release/hostinger-v2-candidate-20260824
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install chromium
      - name: Prove release identity and runtime boundaries
        run: node tests/e2e/live-release-health.mjs
      - name: Prove Tee Cap Tote physical gates
        run: node tests/e2e/live-production-smoke.mjs
      - name: Checkout engineering proof harness
        uses: actions/checkout@v4
        with:
          ref: infra/hostinger-migration-20260823
          path: engineering-harness
      - name: Prove OTP end to end with Temp-Mail.org
        run: node engineering-harness/tests/e2e/live-otp-tempmail.mjs
      - name: Upload live proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hostinger-temporary-live-proof
          path: artifacts/visual
          if-no-files-found: ignore
          retention-days: 7
