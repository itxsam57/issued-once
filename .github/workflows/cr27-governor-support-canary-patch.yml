name: CR27 governor support-canary patch

on:
  push:
    branches:
      - docs/cr27-support-canary-owner-gate-20260901

permissions:
  contents: write

jobs:
  patch-governor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/cr27-support-canary-owner-gate-20260901
      - name: Patch Governor without compressing history
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = '.engineering/CONTINUATION.json';
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));

          data.version = '1.35.3';
          data.updatedAt = '2026-09-01T16:49:01Z';

          data.continuationGovernor.state = 'OWNER_REQUIRED';
          data.continuationGovernor.currentEngineeringStopRequired = true;
          data.continuationGovernor.decision = 'STOP_AT_CR27_SUPPORT_CANARY_FIX_DEPLOYMENT_GATE';
          data.continuationGovernor.currentEngineeringStopReason = 'The owner supplied the matching INTERNAL_OPERATIONS_TOKEN to GitHub Actions and live support proof attempt 3 reached exact release 28ff7deb, but the request was blocked at HTTP 410 by the legacy internal-route proxy before the authenticated support-canary handler could run. A minimal TDD fix now allows only /api/internal/support-canary in addition to the existing jobs/drain exception while all retired internal surfaces remain locked. The correction is merged into the active migration branch and exact-head/post-merge CI plus Browser QA are GREEN. Production still runs 28ff7deb; promoting this new verified correction through the existing Hostinger-selected branch is a new production deployment mutation and requires explicit owner approval.';
          data.continuationGovernor.reason = 'Support proof run 33525915577 attempt 3 job 99937465228 proved the GitHub secret is present and masked, verified exact live release 28ff7deb, then received HTTP 410 Legacy endpoint is disabled from /api/internal/support-canary. Root cause was src/proxy.ts decommissioning every /api/internal/* path except jobs/drain. Draft PR 82 recorded RED run 33532543723 job 99938956338: exactly the new support-canary reachability test failed 410-versus-200 while 687 existing tests passed. Fix head c4f8f6a6b4af11631f238c143496874c1143c423 passed CI run 33533005008 job 99940495961. Normal PR 83 independently passed CI run 33533417781 job 99941813348 and merged at c51864ad5868cc9d84f57b99794b6223049fca6e. Post-merge CI run 33533745465 job 99942882005 and Browser QA run 33533745468 job 99942881731 are GREEN. No Hostinger branch/environment, provider configuration, catalog, real payment/refund, or manufacturing state was changed.';

          data.engineeringFactory.internalWorkStatus = 'CR27_SUPPORT_CANARY_PROXY_FIX_VERIFIED_DEPLOYMENT_OWNER_GATE';
          data.activeTask.status = 'OWNER_REQUIRED';
          data.activeTask.supportCanaryProxyCorrection = {
            githubActionsTokenGate: 'PRESENT_MASKED_MATCHING_VALUE_SUPPLIED_BY_OWNER',
            liveProofRun: 33525915577,
            liveProofAttempt: 3,
            liveProofJob: 99937465228,
            verifiedLiveRelease: '28ff7deb6b1fe7578c271131f1655fc46898cefd',
            exactReleaseGate: 'PASS',
            observedFailure: 'HTTP 410 with exact body Legacy endpoint is disabled before handler authentication/persistence',
            rootCause: 'src/proxy.ts decommissioned all /api/internal/* paths except /api/internal/jobs/drain, making the authenticated /api/internal/support-canary handler unreachable',
            redDraftPullRequest: 82,
            redDraftDisposition: 'CLOSED_UNMERGED_AFTER_CONNECTOR_READY_FOR_REVIEW_SCHEMA_FAILURE',
            redHead: 'cb0ea86e9035028da3b6a7f0037f9ed894fcd7b7',
            redRun: 33532543723,
            redJob: 99938956338,
            redResult: 'PASS_AS_RED: exactly 1 intended new failure; 687 existing tests passed',
            implementationHead: 'c4f8f6a6b4af11631f238c143496874c1143c423',
            implementationRun: 33533005008,
            implementationJob: 99940495961,
            implementationResult: 'PASS: 688 tests, typecheck, lint, production build',
            integrationPullRequest: 83,
            integrationVerificationRun: 33533417781,
            integrationVerificationJob: 99941813348,
            integrationVerificationResult: 'PASS: 688 tests, typecheck, lint, production build',
            integrationMerge: 'c51864ad5868cc9d84f57b99794b6223049fca6e',
            integrationTree: '85e52c1d584cb00dc8cc98619d30deeaf4254378',
            postMergeCiRun: 33533745465,
            postMergeCiJob: 99942882005,
            postMergeCiResult: 'PASS: unit tests, typecheck, lint, production build',
            postMergeBrowserQaRun: 33533745468,
            postMergeBrowserQaJob: 99942881731,
            postMergeBrowserQaResult: 'PASS',
            productionDeploymentPerformed: false,
            liveSupportPersistenceProven: false,
            hostingerEnvironmentChanged: false,
            providerConfigurationChanged: false
          };

          const completed = Array.isArray(data.activeTask.completedEvidence) ? data.activeTask.completedEvidence : [];
          const additions = [
            'Owner completed the GitHub Actions INTERNAL_OPERATIONS_TOKEN gate; attempt 3 proved the secret is present/masked and reached exact live release 28ff7deb before a proxy-level 410.',
            'CR-27 support-canary proxy correction is TDD-verified and integrated at c51864ad5868cc9d84f57b99794b6223049fca6e; post-merge CI 33533745465 and Browser QA 33533745468 are GREEN.'
          ];
          for (const item of additions) if (!completed.includes(item)) completed.push(item);
          data.activeTask.completedEvidence = completed;

          const remaining = Array.isArray(data.activeTask.remainingOwnerEvidence) ? data.activeTask.remainingOwnerEvidence : [];
          data.activeTask.remainingOwnerEvidence = remaining.filter((item) => !item.includes('INTERNAL_OPERATIONS_TOKEN') && !item.includes('automated live support persistence proof'));
          data.activeTask.remainingOwnerEvidence.unshift('Approve deployment of the exact verified support-canary proxy correction through the existing Hostinger-selected v2 branch, without changing the selected branch or environment; then rerun the exact live support persistence proof.');
          data.activeTask.resumeCondition = 'Resume immediately after the owner explicitly approves the CR-27 support-canary proxy-fix production deployment, or after the owner completes another remaining production-readiness gate. Do not ask for secret values. For the support gate, promote only the exact verified correction through the existing Hostinger-selected branch and rerun the exact live proof.';
          data.activeTask.nextSafeDeploymentMutation = 'OWNER APPROVAL REQUIRED: promote the exact verified support-canary correction integrated at c51864ad5868cc9d84f57b99794b6223049fca6e through the existing Hostinger-selected release/hostinger-v2-candidate-20260824 branch without changing Hostinger environment values or selected branch, then rerun support persistence proof.';

          if (data.productionRuntime && typeof data.productionRuntime === 'object') {
            data.productionRuntime.supportCanaryFixIntegrationHead = 'c51864ad5868cc9d84f57b99794b6223049fca6e';
            data.productionRuntime.supportCanaryFixIntegrationTree = '85e52c1d584cb00dc8cc98619d30deeaf4254378';
            data.productionRuntime.supportCanaryFixDeployed = false;
          }

          data.nextAction = {
            actor: 'OWNER',
            instruction: 'Reply exactly APPROVE_CR27_SUPPORT_CANARY_FIX_DEPLOYMENT to authorize promotion of the verified c51864ad support-canary proxy correction through the existing Hostinger-selected v2 branch, with no selected-branch or environment changes. Engineering will then deploy, verify exact live release identity/security, and rerun the support persistence proof. Other catalog/Safepay/Printful/domain gates remain separate.'
          };

          fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n');
          NODE
      - name: Commit Governor checkpoint
        run: |
          if git diff --quiet -- .engineering/CONTINUATION.json; then
            echo 'Governor already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .engineering/CONTINUATION.json
          git commit -m 'docs(cr-27): checkpoint support canary deployment gate'
          git push origin HEAD:docs/cr27-support-canary-owner-gate-20260901
