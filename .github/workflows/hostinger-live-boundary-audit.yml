name: Hostinger Live Boundary Audit

on:
  workflow_dispatch:
  push:
    branches:
      - release/hostinger-v2-candidate-20260824

permissions:
  contents: read

jobs:
  audit-hostinger-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LIVE_PRODUCTION_URL: https://lightgray-coyote-141764.hostingersite.com
    steps:
      - name: Checkout frozen Hostinger V3 candidate
        uses: actions/checkout@v4
        with:
          ref: release/hostinger-v3-candidate-20260825
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install chromium
      - name: Checkout engineering audit harness
        uses: actions/checkout@v4
        with:
          ref: infra/hostinger-migration-20260823
          path: engineering-audit
      - name: Run non-OTP live boundary audit
        run: node engineering-audit/tests/e2e/live-non-otp-boundaries.mjs
