name: Hostinger Live Boundary Audit

on:
  workflow_dispatch:
  push:
    branches:
      - release/hostinger-v2-candidate-20260824

permissions:
  contents: read

jobs:
  audit-hostinger-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LIVE_PRODUCTION_URL: https://lightgray-coyote-141764.hostingersite.com
      EXPECTED_RELEASE_ID: 28ff7deb6b1fe7578c271131f1655fc46898cefd
    steps:
      - name: Checkout proof harness
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install chromium
      - name: Verify deployed release identity
        run: node tests/e2e/live-release-health.mjs
      - name: Run non-OTP live boundary audit
        run: node tests/e2e/live-non-otp-boundaries.mjs
